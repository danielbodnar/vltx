# untrusted-fork: install one or more possibly hostile repositories with
# examples/08-untrusted-fork-pipeline/fork-install.sh (vlt with no install scripts, a vlt query
# gate, and every package phase under its own nono sandbox), then upload the JSON reports.
#
# Run it from the Actions tab (workflow_dispatch). `repos` is a JSON array of git URLs; each URL
# becomes one matrix job. No secrets are required. An optional repository secret VLT_TOKEN is
# exported to fork-install, and 07's profiles hand it to the fetch phase only (never to build
# scripts).
name: untrusted-fork

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'JSON array of git URLs, for example ["https://github.com/sindresorhus/is"]'
        required: true
        default: '["https://github.com/sindresorhus/is"]'
      ref:
        description: Branch or tag to clone (empty for the default branch)
        required: false
        default: ""
      profile:
        description: Registry profile from config/registry.profiles.json (empty for the default)
        required: false
        default: ""
      native:
        description: Use the npm-fetch and native-build fallback instead of vlt
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fork-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(inputs.repos) }}
    env:
      NONO_VERSION: v0.79.0
      # sha256 of nono-v0.79.0-x86_64-unknown-linux-gnu.tar.gz, computed from the downloaded
      # release asset on 2026-10-04 and matching the release's SHA256SUMS.txt
      NONO_SHA256: 36dfeeb6e8c6a30c43f80ba239e2460af43047c008153af527fdd893c1f02392
      VLT_VERSION: 1.3.6
    steps:
      - name: Check out vlt-lab
        uses: actions/checkout@v7
        with:
          # the job runs untrusted code (sandboxed); keep the token out of .git/config anyway
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install nono (pinned release, sha256 verified)
        run: |
          set -eu
          asset="nono-${NONO_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/nolabs-ai/nono/releases/download/${NONO_VERSION}/${asset}"
          echo "${NONO_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nono"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/nono"
          sudo install -m 0755 "$RUNNER_TEMP/nono/nono" /usr/local/bin/nono
          nono --version

      - name: Install vlt
        run: |
          npm install -g "vlt@${VLT_VERSION}"
          vlt --version

      - name: Show sandbox prerequisites
        run: |
          uname -r
          jq --version
          git --version

      - name: fork-install
        env:
          REPO_URL: ${{ matrix.repo }}
          REF: ${{ inputs.ref }}
          PROFILE: ${{ inputs.profile }}
          NATIVE: ${{ inputs.native }}
          VLT_TOKEN: ${{ secrets.VLT_TOKEN }}
        run: |
          set -u
          [ -n "${VLT_TOKEN:-}" ] || unset VLT_TOKEN
          set -- "$REPO_URL" --out "$GITHUB_WORKSPACE/.tmp/fork-reports"
          [ -z "$REF" ] || set -- "$@" --ref "$REF"
          [ -z "$PROFILE" ] || set -- "$@" --profile "$PROFILE"
          [ "$NATIVE" != true ] || set -- "$@" --native
          rc=0
          sh examples/08-untrusted-fork-pipeline/fork-install.sh "$@" 2>"$RUNNER_TEMP/fork-install.stderr" || rc=$?
          cat "$RUNNER_TEMP/fork-install.stderr" >&2
          {
            echo "### fork-install: \`$REPO_URL\` (exit $rc)"
            echo '```'
            sed -n '/^fork-install sh:/,$p' "$RUNNER_TEMP/fork-install.stderr"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fork-report-${{ strategy.job-index }}
          path: .tmp/fork-reports/
          if-no-files-found: warn
